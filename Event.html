<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Invitation</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
        }

        /* Invitation Card */
        .invitation-card {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Titles and Text */
        .event-title {
            font-size: 2rem;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .event-details {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
        }

        .event-name {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .event-info {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .rsvp {
            font-size: 1rem;
            color: #ff5722;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Button */
        .rsvp-button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .rsvp-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="invitation-card">
        <h1 class="event-title">You're Invited!</h1>
        <p class="event-details">Join us for a night to remember as we celebrate:</p>
        <h2 class="event-name">Annual Gala Night</h2>
        <p class="event-info">
            <strong>Date:</strong> Saturday, March 15th, 2025<br>
            <strong>Time:</strong> 7:00 PM<br>
            <strong>Location:</strong> Grand Ballroom, City Center
        </p>
        <p class="rsvp">RSVP by March 10th</p>
        <button class="rsvp-button">RSVP Now</button>
    </div>
</body>
</html>
