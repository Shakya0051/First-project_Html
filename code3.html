<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Front Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: rgb(247, 247, 240);
            color: rgb(33, 7, 7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: url('icon.png') no-repeat center center;
            background-size: contain;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.8rem;
            color: #8b0a0a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <h1>Welcome To Pixels</h1>
        <p>Your journey starts here. Explore the features and possibilities.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
    <footer>&copy; 2024 MyApp Inc. All rights reserved.</footer>
</body>
</html>
