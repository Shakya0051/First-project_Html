<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Open</title>
  <style>
    /* General background styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Full-page gradient background */
    .background {
      background: linear-gradient(to right, #ff7e5f, #feb47b); /* Gradient colors */
      color: white;
      text-align: center;
      padding: 50px;
    }

    /* Link styles */
    a {
      text-decoration: none; /* Removes underline */
      color: white;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    a.normal-link {
      color: #ffeead; /* Soft yellow color */
    }

    a:hover {
      color: #2f0a6c; /* Brighter yellow when hovered */
    }

    a:active {
      color: #dcedc8; /* Light green when active */
    }
  </style>
</head>
<body>
  <div class="background">
    <h1>Now you are in my code</h1>
    <p>
      This is an example of styled links:
      <a href="https://psxid.figma.com/lqjg97licpry" class="normal-link">Classical link</a> |
      <a href="#">Hover Styled Link</a> |
      <a href="#">Active Styled Link</a>
    </p>
  </div>
</body>
</html>
