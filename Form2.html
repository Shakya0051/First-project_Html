<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
        <body>
            <form action="Submit.py"method ="post">
                <h1>Registration Form</h1><br>
                Firstname  : <br><input type="text" placeholder="Firstname"><br> 
                middlename : <br><input type="text" placeholder="middlename"><br>
                lastname   :<br> <input type="text" placeholder="lastname"><br>
                fathername : <br><input type="text" placeholder="fathername"><br>
                mothername :<br> <input type="text" placeholder="mothername"><br>
                <h4>gender</h4>
                <input type="radio" name="gender">male<br>
                <input type="radio" name="gender">female<br>
                <input type="radio" name="gender">other<br>
                <h4>Course</h4>
                <input type="checkbox" value="B.Tech">B.tech<br>
                <input type="checkbox" value="BCA">BCA<br>
                <input type="checkbox" value="M.Tech">M.Tech<br>
                <br>
                address    :<br> <input type="text" placeholder="address"><br>
                mobile number:<br><input type="number" placeholder="mobile number"><br>
                Email      :<br> <input type="email" placeholder="Email"><br>
                password   :<br> <input type="password"placeholder="password"><br>
                <br>
                

                <button type ="submit">login
                </button>
                
            </form>
        </body>
    </head>
</html>
